repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(tasks/|tests/toy/.*\.patch$)
      - id: trailing-whitespace
        exclude: ^(tasks/|tests/toy/.*\.patch$)

  # Local hooks run the versions pinned in uv.lock, so pre-commit and CI cannot disagree.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
