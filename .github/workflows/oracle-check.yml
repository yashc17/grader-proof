name: oracle-check

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Space-separated task folder names under tasks/. Empty means every task.
        default: ""
      conditions:
        description: Space-separated conditions (baseline h1 h2 h3 all) to keep from those tasks. Empty means every condition.
        default: ""

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.list.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: list
        env:
          REQUESTED: ${{ inputs.tasks }}
          CONDITIONS: ${{ inputs.conditions }}
        run: |
          names="${REQUESTED:-$(ls tasks)}"
          if [ -n "$CONDITIONS" ]; then
            names=$(printf '%s\n' $names | grep -E "__($(echo $CONDITIONS | tr ' ' '|'))$" || true)
          fi
          echo "tasks=$(printf '%s\n' $names | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  oracle:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.list.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked

      - name: Disk before images
        run: df -h /

      - run: uv tool install harbor==0.26.0

      - name: Run the oracle 3 times
        run: |
          for run in 1 2 3; do
            harbor run -p "tasks/${{ matrix.task }}" -a oracle -o "runs/run-$run" -n 1 -y \
              || echo "run $run failed"
            df -h / | tail -1
          done

      - name: Write result file
        run: uv run python -m grader_proof.oracle_check collect "${{ matrix.task }}"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: oracle-check-${{ matrix.task }}
          path: oracle-check/
          if-no-files-found: error
